# Apprise REST API — notification bridge for Overleaf CE
#
# Self-contained: runs in its own compose project with its own network and
# volume. No dependency on the Overleaf compose stack.
#
# Usage:
#   1. cp .env.example .env   (fill in SMTP credentials for mailto channels)
#   2. docker compose up -d --build
#   3. Point Overleaf at it:
#        NOTIFICATIONS_APPRISDE_API_URL=http://host.docker.internal:8001
#      (Overleaf must map host.docker.internal -> host-gateway, or use the
#       Docker host gateway IP directly, e.g. http://172.18.0.1:8001)
#
# The API is intentionally bound to all interfaces (8001:8001) so the
# Overleaf container can reach it through the Docker host. On a public
# server, restrict the port with a firewall or bind to 127.0.0.1 and
# adjust the Overleaf URL to the gateway IP.
#
# Browser push (webpush://) and plain mailto work even WITHOUT this
# container — Overleaf falls back to its own SMTP + Web Push. This
# container adds the third-party channels: Telegram, Discord, Slack,
# ntfy, Gotify, Pushover, Nextcloud, Signal, WhatsApp, WeChat, Zoom,
# Zulip, …

services:
  apprise:
    build:
      context: .
      dockerfile: Dockerfile
    image: apprise-api:overleaf
    container_name: apprise
    hostname: apprise
    restart: always

    # Expose the REST API on the Docker host so the Overleaf container
    # can reach it without a shared network.
    ports:
      - "8001:8001"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/status', timeout=5)\""]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

    environment:
      # mailto plugin defaults (apprise-api env prefix APPRISDE_ + SMTP_*)
      # Values come from .env (see .env.example).
      APPRISDE_SMTP_SERVER: ${SMTP_HOST:-smtp.uni-bremen.de}
      APPRISDE_SMTP_PORT: ${SMTP_PORT:-465}
      APPRISDE_SMTP_FROM: ${SMTP_FROM:-overleaf@uni-bremen.de}
      APPRISDE_SMTP_USER: ${SMTP_USER:-overleaf}
      APPRISDE_SMTP_PASS: ${SMTP_PASS:-}
      # implicit TLS (port 465): ssl; alternatives: starttls, insecure
      APPRISDE_SMTP_MODE: ${SMTP_MODE:-ssl}
      APPRISDE_SMTP_TIMEOUT: "30"

    volumes:
      # (reserved for future state; VAPID keys are owned by Overleaf)
      - apprise-data:/data

    networks:
      - apprise-net

networks:
  apprise-net:
    driver: bridge

volumes:
  apprise-data:
