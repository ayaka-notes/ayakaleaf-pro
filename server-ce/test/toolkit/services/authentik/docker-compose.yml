# goauthentik as OIDC, SAML and LDAP identity provider for the e2e suites.
# It joins the toolkit's network, so the sharelatex container and the browser
# in the Cypress container both reach it as http://authentik:9000.
name: e2e-authentik

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8.3
  env_file:
    - authentik.env
    # Generated by bin/prepare; optional so that bin/down works without it
    - path: ${AUTHENTIK_STATE_DIR}/secrets.env
      required: false
  depends_on:
    authentik-postgresql:
      condition: service_healthy
  volumes:
    - ./blueprint.yaml:/blueprints/custom/overleaf-e2e.yaml:ro
    - ${AUTHENTIK_STATE_DIR}:/certs:ro
  shm_size: 512mb

services:
  authentik-postgresql:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-unset}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      retries: 20
    networks: [overleaf]

  authentik-server:
    <<: *authentik
    command: server
    networks:
      overleaf:
        aliases: [authentik]

  authentik-worker:
    <<: *authentik
    command: worker
    networks: [overleaf]

  # Started by bin/up once the blueprint created the outpost and its token.
  authentik-ldap:
    image: ghcr.io/goauthentik/ldap:2026.8.3
    profiles: [ldap]
    environment:
      AUTHENTIK_HOST: http://authentik:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${LDAP_OUTPOST_TOKEN:-unset}
    networks: [overleaf]

networks:
  overleaf:
    name: ${TOOLKIT_NETWORK}
    external: true
