# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Everything the auth e2e suites need: users/groups, an OIDC provider,
# a SAML provider and an LDAP provider + outpost. Secrets come from the env.
version: 1
metadata:
  name: overleaf e2e
context:
  base_dn: dc=ayakaleaf,dc=test
entries:
  # ---------- groups & users ----------
  - model: authentik_core.group
    id: group-admins
    identifiers: { name: Admins }
  - model: authentik_core.group
    id: group-staff
    identifiers: { name: Staff }

  # alice: member of Admins (plus another group, so `groups` is a real array)
  - model: authentik_core.user
    identifiers: { username: alice }
    attrs:
      name: Alice Admin
      email: alice@ayakaleaf.test
      password: !Env E2E_TEST_USER_PASSWORD
      groups: [!KeyOf group-admins, !KeyOf group-staff]
  # bob: regular user, not an admin
  - model: authentik_core.user
    identifiers: { username: bob }
    attrs:
      name: Bob User
      email: bob@ayakaleaf.test
      password: !Env E2E_TEST_USER_PASSWORD
      groups: [!KeyOf group-staff]
  # carol: issue #96 scenario, an admin that already exists locally in
  # ayakaleaf (created via /launchpad) with the same email
  - model: authentik_core.user
    identifiers: { username: carol }
    attrs:
      name: Carol Launchpad
      email: carol@ayakaleaf.test
      password: !Env E2E_TEST_USER_PASSWORD
      groups: [!KeyOf group-admins]
  # dave: in no groups at all (empty `groups` array)
  - model: authentik_core.user
    identifiers: { username: dave }
    attrs:
      name: Dave Nogroup
      email: dave@ayakaleaf.test
      password: !Env E2E_TEST_USER_PASSWORD
  # eve / frank: other email domains, for OVERLEAF_OIDC_ALLOWED_EMAIL_DOMAINS
  - model: authentik_core.user
    identifiers: { username: eve }
    attrs:
      name: Eve Outsider
      email: eve@other.test
      password: !Env E2E_TEST_USER_PASSWORD
  - model: authentik_core.user
    identifiers: { username: frank }
    attrs:
      name: Frank Subdomain
      email: frank@sub.ayakaleaf.test
      password: !Env E2E_TEST_USER_PASSWORD
  # LDAP bind account used by ayakaleaf to search the directory
  - model: authentik_core.user
    id: user-ldapservice
    identifiers: { username: ldapservice }
    attrs:
      name: LDAP service
      email: ldapservice@ayakaleaf.test
      password: !Env E2E_LDAP_BIND_PASSWORD

  # ---------- SAML signing cert (generated by bin/prepare) ----------
  - model: authentik_crypto.certificatekeypair
    id: saml-kp
    identifiers: { name: ayakaleaf-saml-idp }
    attrs:
      certificate_data: !File /certs/idp.crt
      key_data: !File /certs/idp.key

  # ---------- OIDC ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: oidc-provider
    identifiers: { name: ayakaleaf-oidc }
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # End the IdP session too, so the logout test requires fresh credentials.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: !Env E2E_OIDC_CLIENT_ID
      client_secret: !Env E2E_OIDC_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/oidc/login/callback", !Env E2E_OVERLEAF_URL]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Env E2E_OVERLEAF_URL
          redirect_uri_type: logout
        # Linking from the settings page ends with a logout back to it
        - matching_mode: strict
          url: !Format ["%s/user/settings", !Env E2E_OVERLEAF_URL]
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: { slug: ayakaleaf-oidc }
    attrs:
      name: ayakaleaf (OIDC)
      provider: !KeyOf oidc-provider

  # ---------- SAML ----------
  - model: authentik_providers_saml.samlprovider
    id: saml-provider
    identifiers: { name: ayakaleaf-saml }
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # End the IdP session too, so the logout test requires fresh credentials.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      acs_url: !Format ["%s/saml/login/callback", !Env E2E_OVERLEAF_URL]
      audience: ayakaleaf
      issuer_override: ayakaleaf-authentik
      sp_binding: post
      signing_kp: !KeyOf saml-kp
      sign_assertion: true
      sign_response: true
      name_id_mapping: !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
      property_mappings:
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/uid]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/groups]]
  - model: authentik_core.application
    identifiers: { slug: ayakaleaf-saml }
    attrs:
      name: ayakaleaf (SAML)
      provider: !KeyOf saml-provider

  # ---------- LDAP ----------
  - model: authentik_providers_ldap.ldapprovider
    id: ldap-provider
    identifiers: { name: ayakaleaf-ldap }
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      base_dn: !Context base_dn
      search_mode: direct
      bind_mode: direct
    permissions:
      - permission: authentik_providers_ldap.search_full_directory
        user: !KeyOf user-ldapservice
  - model: authentik_core.application
    identifiers: { slug: ayakaleaf-ldap }
    attrs:
      name: ayakaleaf (LDAP)
      provider: !KeyOf ldap-provider
  - model: authentik_outposts.outpost
    identifiers: { name: ayakaleaf-ldap-outpost }
    attrs:
      type: ldap
      providers: [!KeyOf ldap-provider]
      config:
        authentik_host: http://authentik:9000
