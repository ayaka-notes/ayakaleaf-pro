# ---------------------------------
# This workflow is used to build overleaf image automatically
#
# Published at:
#     ghcr.io/ayaka-notes/overleaf-pro/ops
#
# ---------------------------------

name: Build Operations Image
on:
  # Skip pushes that only touch files the image does not contain
  # (see server-ce/Dockerfile and server-ce/.dockerignore)
  push:
    branches:
      - server-pro
    paths-ignore:
      - 'server-ce/test/**'
      - 'server-ce/hotfix/**'
      - 'services/git-bridge/**'
      - 'develop/**'
      - 'doc/**'
      - 'bin/**'
      - '.devcontainer/**'
      - 'docker-compose*.yml'
      - 'LICENSE'
      - '**/*.md'
      - '.github/workflows/build_dev_image.yml'
      - '.github/workflows/build_release_image.yml'
      - '.github/workflows/sync_upstream.yml'
      - '.github/workflows/test_criticality_score.yml'
      - '.github/workflows/test_ops_image.yml'
  pull_request:
    branches:
      - server-pro
    paths-ignore:
      - 'server-ce/test/**'
      - 'server-ce/hotfix/**'
      - 'services/git-bridge/**'
      - 'develop/**'
      - 'doc/**'
      - 'bin/**'
      - '.devcontainer/**'
      - 'docker-compose*.yml'
      - 'LICENSE'
      - '**/*.md'
      - '.github/workflows/build_dev_image.yml'
      - '.github/workflows/build_release_image.yml'
      - '.github/workflows/sync_upstream.yml'
      - '.github/workflows/test_criticality_score.yml'
      - '.github/workflows/test_ops_image.yml'
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      # If the event is a pull request, checkout the head sha of the PR
      - name: "Checkout Current Repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # GHCR image names must be lowercase
      - name: "Set image name"
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/overleaf-pro" >> $GITHUB_ENV

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ${{env.DOCKER_REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      # --- We need to sync yarn.lock/i18 to ensure consistency ---
      - name: "Sync yarn.lock And Prepare .dockerignore"
        run: |
          docker run --rm -v "$(pwd)":/workspace -w /workspace node:24.18.1 sh -c "corepack enable && yarn install --mode=update-lockfile"
          # Apply the highest-versioned locale patch over the base locales before extracting
          patch_dir=$(printf '%s\n' services/web/locales/locales_patches/v*/ | sort -V | tail -n1)
          if [ -d "$patch_dir" ]; then
            echo "Applying locale patch: $patch_dir"
            cp "$patch_dir"*.json services/web/locales/
          else
            echo "No locale patch directory found; skipping"
          fi
          # Merge the added translations over the patched locales
          for f in services/web/locales/locales_patches/added/*.json; do
            [ -f "$f" ] || continue  # no added translations
            lang=$(basename "$f")
            [ "$lang" = added-translations.json ] && continue
            jq -s '.[0] * .[1]' "services/web/locales/$lang" "$f" > "$f.tmp"
            mv "$f.tmp" "services/web/locales/$lang"
          done
          cd ./server-ce/
          cp .dockerignore ../

      # --- Set up Docker ---
      # See: https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Set up Docker (enable containerd image store)
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Buildx (docker driver)
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # --- Build Base Image ---
      - name: "Build base image (hash cache)"
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server-ce/Dockerfile-base
          load: true
          push: false
          pull: true
          tags: |
            overleaf-pro-base:ci
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha,scope=base-${{ hashFiles('server-ce/Dockerfile-base') }}
          cache-to: type=gha,mode=max,scope=base-${{ hashFiles('server-ce/Dockerfile-base') }}
          provenance: false
          sbom: false
      # --- End of Base Image ---
      
      # --- Build Server Image ---
      - name: "Get MONOREPO_REVISION"
        id: vars
        run: |
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          github_short_sha=$(echo ${{ github.sha }} | head -c7)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            github_short_sha=$(echo ${{ github.event.pull_request.head.sha }} | head -c7)
          fi
          tag=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')-$github_short_sha
          echo "Building tag: $tag"
          echo "TAG=$tag" >> $GITHUB_OUTPUT
          # Scheduled tests use latest; only server-pro builds may update it.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/server-pro" ]; then
            echo "LATEST=${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:latest" >> $GITHUB_OUTPUT
          fi

      # The webpack cache mount of the Dockerfile does not outlive the runner,
      # keep it in the Actions cache so webpack starts warm
      - name: "Restore webpack cache"
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: webpack-cache
          key: webpack-cache-${{ github.run_id }}
          restore-keys: webpack-cache-
      - name: "Inject webpack cache"
        if: ${{ !inputs.no_cache }}
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "webpack-cache": {
                "target": "/overleaf/services/web/.cache",
                "id": "server-ce-webpack-cache"
              }
            }
      - name: "Build Server image"
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server-ce/Dockerfile
          # Push straight from the build, new layers compressed with zstd
          outputs: type=image,push=true,compression=zstd,oci-mediatypes=true
          pull: false
          build-args: |
            OVERLEAF_BASE_TAG=overleaf-pro-base:ci
          tags: |
            ${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:${{ steps.vars.outputs.TAG }}
            ${{ steps.vars.outputs.LATEST }}
          annotations: |
            org.opencontainers.image.title=overleaf-pro-ops
            org.opencontainers.image.description=Overleaf Pro operations image, built from every push to server-pro, maintained by ayaka-notes. For testing only.
            org.opencontainers.image.source=https://github.com/ayaka-notes/ayakaleaf-pro
            org.opencontainers.image.version=${{ steps.vars.outputs.MONOREPO_REVISION }}
            space.ayaka.overleaf-pro.ops.revision=${{ steps.vars.outputs.MONOREPO_REVISION }}
          # Cache from the latest server-pro image, its cache is inlined on push
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=registry,ref=${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:latest
          cache-to: type=inline
          provenance: false
          sbom: false
      # --- End of Server Image ---

      # --- Retention Policy: Delete old images ---
      - name: Delete old images
        if: github.repository_owner == 'ayaka-notes'
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: overleaf-pro/ops*
          # Keep latest, the scheduled tests and the build cache use it
          image-tags: "!latest"
          cut-off: 7d
          account: ayaka-notes
          tag-selection: both
          token: ${{ secrets.ORGTOKEN }}
