# ---------------------------------
# This workflow is used to test overleaf image automatically
#
# Tested image:
#     ghcr.io/ayaka-notes/overleaf-pro/ops
#
# ---------------------------------

name: Test Operations Image
on:
  workflow_dispatch:
    inputs:
      ops_tag:
        description: "Ops image tag to test"
        type: string
        default: latest
      arch:
        description: "Platforms to test, arm64 runs after amd64"
        type: choice
        options: [both, amd64, arm64]
        default: both
      suites:
        description: "Only these suites of the groups below, e.g. workbench learn"
        type: string
      grep:
        description: "Only the cases whose title contains this, ';' is OR"
        type: string
  schedule:
    # One hour after the development images are built
    - cron: '0 1 * * *'
permissions:
  contents: read
  packages: read
env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  # Deploy the image with the toolkit and run one group of suites per runner,
  # see server-ce/test/README.md
  e2e-amd64:
    name: amd64 / ${{ matrix.group }}
    if: ${{ (inputs.arch || 'both') != 'arm64' }}
    runs-on: ubuntu-26.04
    env:
      ARCH: amd64
    strategy: &strategy
      fail-fast: false
      # Every suite runs a whole Overleaf; pulling the ops image takes about 20s
      # per job, and a failed setup (e.g. a rate-limited pull) is retried by
      # bin/run-suites
      max-parallel: 20
      matrix:
        include:
          - group: Admin
            suites: admin-tools
          - group: Dropbox
            suites: dropbox
          - group: OIDC
            suites: authentication/oidc
          - group: LDAP and SAML
            suites: authentication/ldap authentication/saml
          - group: Accounts
            suites: login-register user-emails launchpad instance-features
          - group: Git Sync
            suites: github-sync gitlab-sync gitea-sync
          - group: Git and Tokens
            suites: git-bridge oauth2-server mcp-server
          - group: Editor
            suites: track-changes symbol-palette
          - group: AI
            suites: workbench error-assistant
          - group: References and Learn
            suites: reference-picker tpr-webmodule learn
          - group: Compile and Templates
            suites: sandboxed-compiles pandoc python-runner template-gallery open-in-overleaf
    steps: &steps
      - name: "Checkout Current Repository"
        uses: actions/checkout@v7

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ${{env.DOCKER_REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      # --- Deploy And Test ---
      # The suites of a group share this runner and run one after another.
      # With suites picked by hand, a group runs only the ones it has.
      - name: "Deploy And Run E2E Tests"
        working-directory: ./server-ce/test/toolkit
        env:
          PICKED: ${{ inputs.suites }}
          GREP: ${{ inputs.grep }}
        run: |
          # GHCR image names must be lowercase
          export OVERLEAF_IMAGE=${{env.DOCKER_REGISTRY}}/${GITHUB_REPOSITORY_OWNER,,}/overleaf-pro/ops:${{inputs.ops_tag || 'latest'}}
          suites=()
          for suite in ${{matrix.suites}}; do
            if [[ -z $PICKED || " $PICKED " == *" $suite "* ]]; then
              suites+=("$suite")
            fi
          done
          if ((${#suites[@]} > 0)); then
            bin/run-suites "${suites[@]}"
          fi

      # --- Collect Results On Failure ---
      # Artifact names cannot contain a space
      - name: "Get Artifact Name"
        id: artifact
        if: failure()
        run: |
          group="${{matrix.group}}"
          echo "name=e2e-$ARCH-${group// /-}-screenshots" >> $GITHUB_OUTPUT
      - name: "Upload Cypress Screenshots"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.artifact.outputs.name}}
          path: server-ce/test/toolkit/cypress/failed
          if-no-files-found: ignore
          retention-days: 7

  # The same suites on arm64, once amd64 is done so both do not share the
  # concurrent job limit; runs even when an amd64 suite failed
  e2e-arm64:
    name: arm64 / ${{ matrix.group }}
    needs: e2e-amd64
    if: ${{ !cancelled() && (inputs.arch || 'both') != 'amd64' }}
    runs-on: ubuntu-26.04-arm
    env:
      ARCH: arm64
    strategy: *strategy
    steps: *steps
